name: Hosted VERTICE pilot smoke
on:
  pull_request:
    branches: [control/2026-11-26-development-state]
    paths: [.github/workflows/hosted-pilot-smoke.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hosted:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2d72722110b19309decc853f632843a5abe83217
      - name: Verify deployed assets and anonymous isolation without model calls
        run: |
          python - <<'PY'
          import urllib.request as u, urllib.error as e, json, time, hashlib
          from pathlib import Path
          origin='https://vertice-e01-staging.onrender.com'
          def get(path, body=None):
              req=u.Request(origin+path, data=None if body is None else json.dumps(body).encode(), headers={'Content-Type':'application/json','User-Agent':'VERTICE-hosted-smoke/1.0'})
              try:
                  with u.urlopen(req,timeout=60) as r: return r.status,r.headers,r.read()
              except e.HTTPError as r: return r.code,r.headers,r.read()
          # Allow for deployment propagation; never accept the old asset as the candidate.
          expected=Path('brand_intro.js').read_bytes()
          for attempt in range(3):
              status,headers,actual=get('/brand_intro.js')
              if status==200 and actual==expected: break
              if attempt<2: time.sleep(12)
          assert status==200 and actual==expected,'Exact hosted brand asset mismatch'
          for path in ['welcome_turquoise.css','unified_workspace.css']:
              code,_,data=get('/'+path)
              assert code==200 and data==Path(path).read_bytes(),path
          print('HOSTED_ASSETS_MATCH',hashlib.sha256(actual).hexdigest())
          code,headers,data=get('/')
          assert code==200 and b'Entorno de prueba' in data and b'workspace-preview' in data
          assert "connect-src 'self'" in headers.get('Content-Security-Policy','')
          assert headers.get('Cache-Control')=='no-store'
          code,_,data=get('/health')
          health=json.loads(data)
          assert code==200 and health['status']=='ok' and health['cloud'] is False and health['auth']=='existing-account-only'
          code,_,data=get('/assistant/status')
          ai=json.loads(data)
          assert code==200
          print('HOSTED_AI_CONFIGURED',bool(ai.get('external_ai_available')),'MODEL_CALLS',0)
          assert ai.get('external_ai_available') is True,'Hosted Groq configuration is not available'
          code,_,_=get('/assistant/knowledge',{'section':'S01','question':'Qué es un indicador'})
          assert code==401,'Anonymous assistant request not denied'
          for path in ['/projects','/openapi.json','/backend/main.py']:
              code,_,_=get(path)
              assert code in (404,405),path
          print('HOSTED_PILOT_SMOKE_PASS')
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --no-package-lock --ignore-scripts @playwright/test@1.56.1
          npx playwright install chromium
      - name: Hosted browser formulation and real document download (synthetic partial draft)
        run: |
          node <<'JS'
          const {chromium}=require('@playwright/test');
          const assert=require('node:assert/strict'),fs=require('node:fs');
          const origin='https://vertice-e01-staging.onrender.com';
          const idea='Caso sintético QA: fortalecer procesos de formación musical de niños y jóvenes de Neira, Caldas, mediante práctica musical colectiva.';
          (async()=>{
            const browser=await chromium.launch();
            try{
              const page=await browser.newPage({viewport:{width:1440,height:900},reducedMotion:'reduce',acceptDownloads:true});
              const blocked=[],errors=[],posts=[];
              page.on('pageerror',e=>errors.push(e.message));
              await page.route('**/*',r=>{
                const u=new URL(r.request().url()),m=r.request().method();
                if(u.origin===origin){
                  if(m!=='GET'&&m!=='HEAD'){
                    posts.push(u.pathname);
                    if(!['/documents/pdf','/documents/docx','/vester/calculate','/territory/resolve'].includes(u.pathname)){blocked.push(u.pathname);return r.abort()}
                  }
                  return r.continue()
                }
                if(u.hostname==='cdn.jsdelivr.net'&&m==='GET')return r.continue();
                blocked.push(u.hostname);return r.abort();
              });
              await page.goto(origin+'/',{waitUntil:'domcontentloaded',timeout:90000});
              await page.locator('#vtWelcome').waitFor();
              await page.locator('#vtIdea').fill(idea);
              await page.locator('#vtStart').click();
              const nav=code=>page.locator('#guidedJourney [data-code="'+code+'"]');
              const field=id=>page.locator('#fields [data-field="'+id+'"]');
              await field('idea_inicial_usuario').waitFor();
              assert.equal(await field('idea_inicial_usuario').inputValue(),idea);
              await field('nombre_del_proyecto').fill('QA SINTETICO — Talleres musicales Neira');
              await field('municipio').fill('Neira');
              await field('departamento').fill('Caldas');
              await page.locator('#save').click();
              await nav('S02').click();
              await field('territorio_o_lugar_de_intervencion').fill('Neira, Caldas (caso sintético; caracterización pendiente)');
              await page.locator('#save').click();
              await nav('S03').click();
              await field('poblacion_afectada').fill('Niños y jóvenes; cantidad pendiente de verificar');
              await page.locator('#save').click();
              await nav('S04').click();
              await field('evidencia_disponible').fill('Sin evidencia primaria verificada. Ejercicio sintético.');
              await page.locator('#save').click();
              await nav('S05').click();
              await field('situaciones_observables').fill('Hipótesis por contrastar: acceso irregular a práctica musical colectiva.');
              await page.locator('#save').click();
              for(let n=6;n<=16;n++){
                const code='S'+String(n).padStart(2,'0');
                await nav(code).click();
                await page.waitForFunction(c=>document.querySelector('#counter')?.textContent.startsWith(c),code);
              }
              const payload=await page.evaluate(()=>window.fcProjectDocumentPayload());
              assert.equal(payload.document_status,'Proyecto en revisión','Incomplete project incorrectly approved');
              const before=await page.evaluate(()=>localStorage.getItem('formulador-cultural-prototipo-v1'));
              fs.mkdirSync('test-results/hosted-pilot',{recursive:true});
              for(const kind of ['pdf','docx']){
                const response=page.waitForResponse(r=>r.url()===origin+'/documents/'+kind&&r.request().method()==='POST'&&r.status()!==429,{timeout:90000});
                const download=page.waitForEvent('download',{timeout:90000});
                await page.locator(kind==='pdf'?'#expPdf':'#expDocx').click();
                const r=await response;assert.equal(r.status(),200);
                const file=await download,bytes=fs.readFileSync(await file.path());
                assert(bytes.length>2500);
                assert.equal(bytes.subarray(0,kind==='pdf'?5:2).toString(),kind==='pdf'?'%PDF-':'PK');
                const state=await page.evaluate(()=>window.fcGetDocumentGeneratorStatus());
                assert.equal(state.mode,'python');assert.equal(state.connected,true);
                await file.saveAs('test-results/hosted-pilot/Neira-sintetico.'+kind);
                console.log('HOSTED_EXPORT_PASS',kind,bytes.length);
              }
              assert.equal(await page.evaluate(()=>localStorage.getItem('formulador-cultural-prototipo-v1')),before,'Export modified saved draft');
              await page.reload({waitUntil:'domcontentloaded'});
              if(await page.locator('#vtWelcome').isVisible())await page.locator('#vtResume').click();
              await nav('S01').click();
              assert.equal(await field('idea_inicial_usuario').inputValue(),idea);
              assert.equal(await field('nombre_del_proyecto').inputValue(),'QA SINTETICO — Talleres musicales Neira');
              await nav('S03').click();
              assert.equal(await field('poblacion_afectada').inputValue(),'Niños y jóvenes; cantidad pendiente de verificar');
              assert.deepEqual(errors,[]);assert.deepEqual(blocked,[]);
              console.log('HOSTED_BROWSER_PASS',JSON.stringify({sectionsVisited:16,sectionsWithInput:5,exported:2,documentStatus:payload.document_status,posts,modelCalls:0}));
            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hosted-pilot-synthetic-exports
          path: test-results/hosted-pilot/
          if-no-files-found: ignore
          retention-days: 7
