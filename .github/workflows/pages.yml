name: Publicar prototipo

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - name: Instalar dependencias
        run: pip install -r backend/requirements.txt
      - name: Ejecutar pruebas Python
        run: python -m pytest backend -q
      - name: Validar sintaxis JavaScript
        run: |
          for file in \
            preboot.js \
            app.js \
            sections_extension.js \
            guidance.js \
            evidence.js \
            s05_preflight.js \
            vester.js \
            causal_validation.js \
            decision_guidance.js \
            tree_validation_bridge.js \
            tree.js \
            synthesis.js \
            visualization.js \
            s07_front.js \
            objectives.js \
            workflow.js; do
            node --check "$file"
          done
      - name: Verificar archivos públicos esenciales
        run: |
          test -f index.html
          test -f style.css
          for file in \
            preboot.js \
            app.js \
            sections_extension.js \
            guidance.js \
            evidence.js \
            s05_preflight.js \
            vester.js \
            causal_validation.js \
            decision_guidance.js \
            tree_validation_bridge.js \
            tree.js \
            synthesis.js \
            visualization.js \
            s07_front.js \
            objectives.js \
            workflow.js; do
            test -f "$file"
            grep -q "$file" index.html
          done

  deploy:
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Preparar artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
