name: Publicar prototipo

on:
  push:
    branches: ["main", "audit/**", "ux/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-v2
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - name: Instalar dependencias
        run: pip install -r backend/requirements.txt
      - name: Ejecutar pruebas Python
        run: python -m pytest backend -q
      - name: Instalar jsdom para smoke test
        run: npm install jsdom@25 --no-save --no-package-lock
      - name: Validar sintaxis JavaScript
        run: |
          for file in \
            preboot.js \
            app.js \
            sections_extension.js \
            guidance.js \
            evidence.js \
            s05_preflight.js \
            vester.js \
            causal_validation.js \
            decision_guidance.js \
            simple_causal_ui.js \
            tree_validation_bridge.js \
            tree.js \
            synthesis.js \
            visualization.js \
            s07_front.js \
            simple_tree_ui.js \
            semantic_writing.js \
            data_cleanup.js \
            objectives.js \
            workflow.js \
            completion.js \
            results_layer.js \
            coherence_engine.js \
            export_completion.js \
            completion_bridge.js \
            planning.js \
            deliverables.js \
            visual_exports_ui.js \
            review_dashboard.js \
            guided_experience.js; do
            node --check "$file"
          done
      - name: Ejecutar smoke test del front
        run: node ci_front_smoke.js
      - name: Ejecutar auditoría de arquitectura
        run: node ci_architecture_check.js
      - name: Ejecutar auditoría de densidad didáctica
        run: node ci_didactic_density_check.js
      - name: Ejecutar auditoría semántica
        run: node ci_semantic_writing_check.js
      - name: Ejecutar auditoría de contexto real y depuración
        run: node ci_contextual_guidance_check.js
      - name: Ejecutar auditoría de botones
        run: node ci_button_contract_check.js
      - name: Ejecutar prueba de compatibilidad del proyecto
        run: node ci_project_compatibility_test.js
      - name: Verificar archivos públicos esenciales
        run: |
          test -f index.html
          test -f style.css
          test -f completion.css
          test -f guided_experience.css
          for file in \
            preboot.js \
            app.js \
            sections_extension.js \
            guidance.js \
            evidence.js \
            s05_preflight.js \
            vester.js \
            causal_validation.js \
            decision_guidance.js \
            tree_validation_bridge.js \
            tree.js \
            synthesis.js \
            visualization.js \
            s07_front.js \
            objectives.js \
            workflow.js \
            completion.js \
            results_layer.js \
            coherence_engine.js \
            export_completion.js \
            completion_bridge.js \
            guided_experience.js; do
            test -f "$file"
            grep -q "$file" index.html
          done
          grep -q "S01–S16" index.html
          grep -q "Revisión del proyecto" coherence_engine.js

      - name: Smoke E2E contra Render producción
        run: |
          set -euo pipefail
          BASE="https://formulador-cultural-api.onrender.com"
          curl --fail --silent --show-error --max-time 120 "$BASE/health" -o health.json
          cat health.json
          grep -q '"status":"ok"' health.json
          grep -q '"persistence":"memory"' health.json

          cat > payload.json <<'JSON'
          {
            "title":"Prueba E2E Formulador Cultural",
            "entity":"Universidad de Caldas",
            "territory":"Manizales",
            "responsible":"Prueba automatizada",
            "summary":"Validación de integración de producción.",
            "problem":"Baja participación cultural de prueba.",
            "objective_general":"Incrementar la participación cultural de prueba.",
            "objectives":[{"id":"O1","text":"Fortalecer la participación cultural.","zone":"direct_cause","parentId":"OC"}],
            "strategy":"Acompañamiento cultural territorial.",
            "results":[{"id":"R1","text":"Proceso de acompañamiento implementado."}],
            "activities":[{"id":"A1","resultId":"R1","resultText":"Proceso de acompañamiento implementado.","objectiveId":"O1","objectiveText":"Fortalecer la participación cultural.","text":"Realizar cuatro encuentros culturales."}],
            "indicators":[],
            "schedule":[],
            "budget":[],
            "risks":[],
            "problem_tree":[{"id":"PC","zone":"central","text":"Baja participación cultural"}],
            "objective_tree":[{"id":"OC","zone":"central","text":"Incrementar la participación cultural","confirmed":true}],
            "vester":{"rows":[],"meanInfluence":0,"meanDependence":0},
            "coherence":{"score":90,"summary":"Prueba controlada."}
          }
          JSON

          curl --fail --silent --show-error --max-time 120 \
            -X OPTIONS \
            -H 'Origin: https://basspauloandres-svg.github.io' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type' \
            -D cors.headers "$BASE/documents/pdf" -o cors.body
          grep -qi 'access-control-allow-origin: https://basspauloandres-svg.github.io' cors.headers

          curl --fail --silent --show-error --max-time 180 \
            -H 'Content-Type: application/json' \
            -H 'Origin: https://basspauloandres-svg.github.io' \
            --data-binary @payload.json -D docx.headers \
            "$BASE/documents/docx" -o test.docx
          test "$(head -c 2 test.docx)" = "PK"
          test "$(wc -c < test.docx)" -gt 10000
          grep -qi 'access-control-allow-origin: https://basspauloandres-svg.github.io' docx.headers

          curl --fail --silent --show-error --max-time 180 \
            -H 'Content-Type: application/json' \
            -H 'Origin: https://basspauloandres-svg.github.io' \
            --data-binary @payload.json -D pdf.headers \
            "$BASE/documents/pdf" -o test.pdf
          test "$(head -c 4 test.pdf)" = "%PDF"
          test "$(wc -c < test.pdf)" -gt 10000
          grep -qi 'access-control-allow-origin: https://basspauloandres-svg.github.io' pdf.headers

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Preparar artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
