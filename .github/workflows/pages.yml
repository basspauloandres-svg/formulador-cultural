name: Publicar prototipo

on:
  push:
    branches: ["main", "audit/**", "ux/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Aislar cada rama/PR para que las pruebas no cancelen el despliegue de main.
  group: pages-v2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - name: Instalar dependencias
        run: pip install -r backend/requirements.txt
      - name: Ejecutar pruebas Python
        run: python -m pytest backend -q
      - name: Instalar jsdom para smoke test
        run: npm install jsdom@25 --no-save --no-package-lock
      - name: Validar sintaxis JavaScript
        run: |
          for file in \
            preboot.js \
            app.js \
            sections_extension.js \
            guidance.js \
            evidence.js \
            s05_preflight.js \
            vester.js \
            causal_validation.js \
            decision_guidance.js \
            simple_causal_ui.js \
            tree_validation_bridge.js \
            tree.js \
            synthesis.js \
            visualization.js \
            s07_front.js \
            simple_tree_ui.js \
            semantic_writing.js \
            data_cleanup.js \
            objectives.js \
            workflow.js \
            completion.js \
            results_layer.js \
            project_snapshot.js \
            coherence_engine.js \
            export_completion.js \
            completion_bridge.js \
            planning.js \
            deliverables.js \
            visual_exports_ui.js \
            review_dashboard.js \
            guided_experience.js; do
            node --check "$file"
          done
      - name: Ejecutar smoke test del front
        run: node ci_front_smoke.js
      - name: Ejecutar auditoría de arquitectura
        run: node ci_architecture_check.js
      - name: Ejecutar auditoría de densidad didáctica
        run: node ci_didactic_density_check.js
      - name: Ejecutar auditoría semántica
        run: node ci_semantic_writing_check.js
      - name: Ejecutar auditoría de contexto real y depuración
        run: node ci_contextual_guidance_check.js
      - name: Ejecutar auditoría de botones
        run: node ci_button_contract_check.js
      - name: Ejecutar prueba de compatibilidad del proyecto
        run: node ci_project_compatibility_test.js
      - name: Verificar aislamiento sintético entre proyectos
        run: node ci_multiproject_isolation_test.js
      - name: Probar navegación sin sincronización involuntaria
        run: node ci_navigation_noop_test.js
      - name: Verificar archivos públicos esenciales
        run: |
          test -f index.html
          test -f style.css
          test -f completion.css
          test -f guided_experience.css
          for file in \
            preboot.js \
            app.js \
            sections_extension.js \
            guidance.js \
            evidence.js \
            s05_preflight.js \
            vester.js \
            causal_validation.js \
            decision_guidance.js \
            tree_validation_bridge.js \
            tree.js \
            synthesis.js \
            visualization.js \
            s07_front.js \
            objectives.js \
            workflow.js \
            completion.js \
            results_layer.js \
            project_snapshot.js \
            coherence_engine.js \
            export_completion.js \
            completion_bridge.js \
            guided_experience.js; do
            test -f "$file"
            grep -q "$file" index.html
          done
          grep -q "S01–S16" index.html
          grep -q "Revisión del proyecto" coherence_engine.js

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Preparar artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
