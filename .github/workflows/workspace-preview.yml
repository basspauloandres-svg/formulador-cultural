name: Workspace integration validation
on:
  pull_request:
    branches: [s02-research-first-20261124]
    paths:
      - index.html
      - guided_experience.js
      - deliverables.js
      - export_completion.js
      - ci_qa_integrated_export_execution_test.js
      - workspace_preview.css
      - e2e/workspace-preview.spec.cjs
      - .github/workflows/workspace-preview.yml
permissions:
  contents: read
jobs:
  visual-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependency
        run: |
          npm install --no-save --no-package-lock --ignore-scripts @playwright/test@1.56.1
          npx playwright install chromium
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing document generator dependencies
        run: pip install -r backend/requirements.txt
      - name: Check document status across export formats
        run: node ci_qa_integrated_export_execution_test.js
      - name: Run existing browser regression and workspace tests
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/workspace-preview.log 2>&1 &
          FRONT_PID=$!
          python3 -m http.server 5500 --bind 127.0.0.1 > /tmp/workspace-preview-5500.log 2>&1 &
          ALT_PID=$!
          (cd backend && python3 -m uvicorn main:app --host 127.0.0.1 --port 8000) > /tmp/workspace-api.log 2>&1 &
          API_PID=$!
          trap 'kill "$FRONT_PID" "$ALT_PID" "$API_PID" 2>/dev/null || true' EXIT
          curl --retry 10 --retry-connrefused --retry-delay 1 --fail --silent --output /dev/null http://127.0.0.1:8765/
          curl --retry 10 --retry-connrefused --retry-delay 1 --fail --silent --output /dev/null http://127.0.0.1:5500/
          curl --retry 20 --retry-connrefused --retry-delay 1 --fail --silent --output /dev/null http://127.0.0.1:8000/health
          cat > workspace-test.config.cjs <<'EOF'
          const base=require('./playwright.config.cjs');
          module.exports={...base,testMatch:[...base.testMatch,'**/workspace-preview.spec.cjs'],globalTimeout:240000};
          EOF
          npx playwright test --config workspace-test.config.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-integrated-synthetic
          path: |
            test-results/
            playwright-report/
          retention-days: 3
          if-no-files-found: ignore
