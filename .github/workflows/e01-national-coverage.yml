name: E01 national coverage
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install httpx==0.28.1
      - name: Audit complete DIVIPOLA universe and cultural registry
        env:
          PYTHONPATH: backend
        run: python scripts/e01_national_coverage.py
